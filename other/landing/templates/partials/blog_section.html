{{define "blog_section"}}
<section id="blog">
    <div class="container">
        <header class="section-header">
            <div>
                <div class="badge-container">
                    <span class="badge-text" style="color: var(--text-primary)">03 Blog</span>
                    <div class="badge-line"></div>
                </div>
                <div class="section-title-container">
                    <h2>Insights<br><span class="muted">Latest from OhRats</span></h2>
                </div>
            </div>
            <a href="/blog" class="header-link">
                Read All Posts
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 12h14M12 5l7 7-7 7"/>
                </svg>
            </a>
        </header>

        <div class="article-grid">
            {{range .RecentPosts}}
                <a href="{{.Href}}" class="article-card">
                    <div class="image">
                        {{if .Image}}
                            <img src="{{.Image}}" alt="{{.Title}}">
                        {{end}}
                        <div class="overlay"></div>
                        {{if .Badge}}
                            <div class="image-badge">{{.Badge}}</div>
                        {{end}}
                    </div>
                    <div class="content">
                        <div class="meta">
                            {{if .Date}}
                                <time class="date">{{.Date}}</time>
                            {{end}}
                        </div>
                        <h3>{{.Title}}</h3>
                    </div>
                </a>
            {{end}}
        </div>
    </div>
</section>
{{end}}
